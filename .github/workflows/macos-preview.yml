name: macOS build validation
on:
  push:
    branches: [main, 'codex/release-*']
  workflow_dispatch:
    inputs:
      validation:
        description: 'Use full for app changes; package or ui isolates packaging/rendering changes'
        type: choice
        options: [full, package, ui]
        default: full
      ffmpeg_tests:
        description: 'Re-run FFmpeg functional tests; enable when changing the pinned media build'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-preview-${{ github.ref }}-${{ github.event.inputs.validation || 'full' }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # App-only releases keep the previously validated media source. Packaging
      # still checks that its native helper, source and notices are included.
      DOWNLOAD_ENGINE_SKIP_FFMPEG_TESTS: ${{ inputs.ffmpeg_tests && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release documentation
        run: |
          node scripts/Check-ReleaseDocs.cjs
          node --test scripts/Check-ReleaseDocs.test.cjs
      - name: Rust cache identity
        id: rust-cache-identity
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/rust-toolchain"
          rustc -vV > "$identity"
          cargo -V >> "$identity"
          xcodebuild -version >> "$identity"
          xcrun --show-sdk-path >> "$identity"
          xcrun --show-sdk-version >> "$identity"
          xcrun clang --version >> "$identity"
          printf '%s\n' "$MACOSX_DEPLOYMENT_TARGET" "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_INCREMENTAL" "${RUSTFLAGS:-}" "${CARGO_ENCODED_RUSTFLAGS:-}" >> "$identity"
          toolchain=$(shasum -a 256 "$identity" | cut -d ' ' -f 1)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - name: Restore Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache Cargo credentials, test profiles, keychains or packages.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
            torrent/target/debug/.fingerprint
            torrent/target/debug/build
            torrent/target/debug/deps
          key: rust-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.toolchain }}-${{ hashFiles('.github/workflows/macos-preview.yml', 'scripts/Run-MacTests.cjs', 'scripts/Package-Unix.sh') }}-${{ hashFiles('Cargo.lock', 'torrent/Cargo.lock', 'Cargo.toml', 'torrent/Cargo.toml') }}
          # Reuse unchanged crates after a lock/version change; Cargo still
          # resolves the current locks and rebuilds changed dependencies.
          restore-keys: |
            rust-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.toolchain }}-${{ hashFiles('.github/workflows/macos-preview.yml', 'scripts/Run-MacTests.cjs', 'scripts/Package-Unix.sh') }}-
      - name: Native toolchain
        run: |
          # Use the runner's installed compiler and SDK; do not install tools.
          rustc -vV
          xcrun --show-sdk-path
          command -v pkg-config
          node --test scripts/Run-NativeCi.test.cjs
          node --test scripts/Run-MacTests.test.cjs
          node --test scripts/LicenseNotices.test.cjs
          node --test scripts/RustCiCache.test.cjs
          cargo fetch --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path torrent/Cargo.toml --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Isolated test keychain
        run: |
          keychain="$RUNNER_TEMP/download-engine-tests.keychain-db"
          security create-keychain -p 'public-ci-fixture' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p 'public-ci-fixture' "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Torrent regression tests
        if: github.event.inputs.validation == '' || github.event.inputs.validation == 'full'
        timeout-minutes: 15
        env:
          DOWNLOAD_ENGINE_CI_IDLE_TIMEOUT_MS: '300000'
        run: |
          node scripts/Run-NativeCi.cjs torrent-tests "$RUNNER_TEMP/native-diagnostics" cargo test --locked --offline --manifest-path torrent/Cargo.toml -j 2 -- --test-threads=2
      - name: Build pinned native FFmpeg
        if: github.event.inputs.validation != 'ui'
        run: |
          node scripts/Run-NativeCi.cjs ffmpeg "$RUNNER_TEMP/native-diagnostics" bash scripts/Build-UnixFfmpeg.sh "$RUNNER_TEMP/native-ffmpeg"
          echo "DOWNLOAD_ENGINE_FFMPEG_PATH=$RUNNER_TEMP/native-ffmpeg/ffmpeg" >> "$GITHUB_ENV"
          echo "DOWNLOAD_ENGINE_NATIVE_FFMPEG=$RUNNER_TEMP/native-ffmpeg" >> "$GITHUB_ENV"
          echo "DOWNLOAD_ENGINE_FFMPEG_SHA256=$(awk '/  ffmpeg$/ {print $1}' "$RUNNER_TEMP/native-ffmpeg/build-record/binaries.sha256")" >> "$GITHUB_ENV"
      - name: Native regression tests
        if: github.event.inputs.validation == '' || github.event.inputs.validation == 'full'
        # Intel needed 37 minutes through desktop tests alone. Leave room for
        # integration/torrent suites; the five-minute inactivity guard remains.
        timeout-minutes: 60
        env:
          DOWNLOAD_ENGINE_CI_IDLE_TIMEOUT_MS: '300000'
        run: |
          node scripts/Run-NativeCi.cjs root-tests "$RUNNER_TEMP/native-diagnostics" node scripts/Run-MacTests.cjs
      - name: Package preview
        if: github.event.inputs.validation != 'ui'
        run: |
          node scripts/Run-NativeCi.cjs packaging-tests "$RUNNER_TEMP/native-diagnostics" bash scripts/Test-UnixPackaging.sh
          node scripts/Run-NativeCi.cjs package "$RUNNER_TEMP/native-diagnostics" bash scripts/Package-Unix.sh "$RUNNER_TEMP/packages"
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/packages/DownloadEngine-*-macos-*/)
          [[ ${#packages[@]} -eq 1 ]] || { echo '::error::Expected exactly one native package'; exit 1; }
          node scripts/Run-NativeCi.cjs package-smoke "$RUNNER_TEMP/native-diagnostics" bash scripts/Test-NativePackage.sh "${packages[0]}"
      - name: Build native UI test executable
        timeout-minutes: 25
        run: |
          node scripts/Run-NativeCi.cjs ui-build "$RUNNER_TEMP/native-diagnostics" cargo build --locked --offline --bin de --features screenshot -j 2
      - name: Native UI rendering checks
        timeout-minutes: 5
        run: |
          node scripts/Run-NativeCi.cjs ui-tests "$RUNNER_TEMP/native-diagnostics" node scripts/Test-NativeUi.cjs target/debug/de
      - name: Redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostics-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && github.event.inputs.validation != 'ui'
        with:
          name: macos-preview-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/packages/*.zip
            ${{ runner.temp }}/packages/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove test keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/download-engine-tests.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - name: Prepare Rust dependency cache
        if: success() && github.ref == 'refs/heads/main' && (github.event.inputs.validation == '' || github.event.inputs.validation == 'full') && steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          # Keep dependency compilation, not this checkout's app/test binaries.
          cargo clean --locked --offline --package download-engine --package de-torrent
          cargo clean --locked --offline --release --package download-engine --package de-torrent
          cargo clean --locked --offline --manifest-path torrent/Cargo.toml --package de-torrent
      - name: Save Rust dependencies
        if: success() && github.ref == 'refs/heads/main' && (github.event.inputs.validation == '' || github.event.inputs.validation == 'full') && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
            torrent/target/debug/.fingerprint
            torrent/target/debug/build
            torrent/target/debug/deps
