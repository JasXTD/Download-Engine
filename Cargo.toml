[package]
name = "download-engine"
version = "3.10.2"
license = "MIT"
edition = "2024"
default-run = "de"

# Short program names: de.exe (desktop), de-cli.exe, de-host.exe and de-torrent.exe (src/bin).
[[bin]]
name = "de"
path = "src/main.rs"

[features]
screenshot = ["eframe/__screenshot"]

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
same-file = "1"
percent-encoding = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "system-proxy", "socks"] }
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
base64 = "0.23"
httpdate = "1"
zeroize = "1.9.1"
raw-window-handle = "0.6"
scraper = { version = "0.27", default-features = false }
cssparser = "0.37"
quick-xml = "0.41"
mlua = { version = "=0.12.2", features = ["lua54", "vendored", "serde", "error-send"] }
de-torrent = { path = "torrent" }

[target.'cfg(unix)'.dependencies]
# Keep native Windows dialogs, DPAPI and CNG unchanged. These supply the same
# capabilities on macOS/Linux, without changing the shared egui interface.
aes = { version = "=0.8.4", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
libc = "0.2"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Select native stores explicitly; the all-in-one keyring wrapper uses ZBus on Linux.
keyring-core = { version = "=1.0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
dbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
# Reuse the Apple bindings already locked through the GUI dependencies.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSData", "NSLocale", "NSAppleEventManager", "NSAppleEventDescriptor"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_SystemServices", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Power", "Win32_Media_Audio"] }

windows-core = "0.62"

[build-dependencies]
find-msvc-tools = "0.1.14"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha1 = "0.10"
tokio = { version = "1.53.3", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"

# epaint 0.36.2 with bidirectional text layout; see vendor/epaint/patch.md.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
# The BitTorrent crates copied from rqbit; see vendor/rqbit/patch.md.
librqbit-bencode = { path = "vendor/rqbit/librqbit-bencode" }
librqbit-buffers = { path = "vendor/rqbit/librqbit-buffers" }
librqbit-clone-to-owned = { path = "vendor/rqbit/librqbit-clone-to-owned" }
librqbit-core = { path = "vendor/rqbit/librqbit-core" }
librqbit-dht = { path = "vendor/rqbit/librqbit-dht" }
librqbit-dualstack-sockets = { path = "vendor/rqbit/librqbit-dualstack-sockets" }
librqbit-peer-protocol = { path = "vendor/rqbit/librqbit-peer-protocol" }
librqbit-sha1-wrapper = { path = "vendor/rqbit/librqbit-sha1-wrapper" }
librqbit-tracker-comms = { path = "vendor/rqbit/librqbit-tracker-comms" }

