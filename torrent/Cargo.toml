[package]
name = "de-torrent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "de_torrent"
path = "src/lib.rs"

[[bin]]
name = "de-torrent"
path = "src/main.rs"

# Its own workspace, so that the tests and the lab can build it without the desktop app.
[workspace]

[features]
# Commands only the test lab uses: file snapshots and SHA-256 checks.
lab = []

[dependencies]
anyhow = "1"
bencode = { package = "librqbit-bencode", version = "9.1.0" }
buffers = { package = "librqbit-buffers", version = "9.1.0" }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
librqbit-core = "9.1.0"
librqbit-dht = "9.1.0"
librqbit-dualstack-sockets = "0.7"
librqbit-peer-protocol = "9.1.0"
librqbit-tracker-comms = "9.1.0"
librqbit-utp = { path = "../vendor/librqbit-utp" }
# Already locked and used by the application; MSE uses legacy DH and SHA-1.
num-bigint = "=0.4.8"
getrandom = "=0.4.3"
zeroize = "1.9.1"
parking_lot = "0.12"
# Reads the router's answers for router setup. The app already uses this version, so its
# build gains no crate.
quick-xml = "0.41"
# Unbound HTTPS uses the app's reqwest TLS features. Bound HTTPS uses the
# native TLS stack below, including in standalone offline engine tests.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Reuse the app's locked HTTP/TLS stack for sockets bound on Windows too.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1w = { package = "librqbit-sha1-wrapper", version = "9.1.0" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
# IpHelper, Ndis and WinSock read the routing table for router setup.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSLocale"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
librqbit-bencode = { path = "../vendor/rqbit/librqbit-bencode" }
librqbit-buffers = { path = "../vendor/rqbit/librqbit-buffers" }
librqbit-clone-to-owned = { path = "../vendor/rqbit/librqbit-clone-to-owned" }
librqbit-core = { path = "../vendor/rqbit/librqbit-core" }
librqbit-dht = { path = "../vendor/rqbit/librqbit-dht" }
librqbit-dualstack-sockets = { path = "../vendor/rqbit/librqbit-dualstack-sockets" }
librqbit-peer-protocol = { path = "../vendor/rqbit/librqbit-peer-protocol" }
librqbit-sha1-wrapper = { path = "../vendor/rqbit/librqbit-sha1-wrapper" }
librqbit-tracker-comms = { path = "../vendor/rqbit/librqbit-tracker-comms" }

[profile.release]
debug = 0
strip = true
lto = "thin"
